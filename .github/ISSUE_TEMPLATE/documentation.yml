name: Documentation issue
description: Report incorrect, missing, or hard-to-find project documentation.
title: "[Docs]: "
labels: [documentation]
body:
  - type: input
    id: location
    attributes:
      label: Page or section
      placeholder: URL, repository path, or search terms used
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: Task you were trying to complete
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What was incorrect or missing?
      description: Include the command, package/version, platform, or term that caused confusion.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
  - type: dropdown
    id: audience
    attributes:
      label: Audience
      options: [Evaluator, Game developer, XAML user, Control author, Runtime/backend integrator, Contributor]
    validations:
      required: true
