name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  runtime:
    name: ${{ matrix.runtime }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        runtime: [MonoGame, FNA]
    runs-on: ${{ matrix.os }}
    env:
      FORMA_RUNTIME: ${{ matrix.runtime }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet tool restore
      - run: bash scripts/check-compliance.sh
      - name: Verify deterministic default theme icons
        run: dotnet run --project tools/Forma.IconPipeline/Forma.IconPipeline.csproj -- verify
      - name: Unit and catalog inventory tests
        shell: bash
        run: dotnet test tests/Forma.Tests/Forma.Tests.csproj --configuration Release -p:FormaRuntime="$FORMA_RUNTIME" --nologo
      - name: Compile render tests
        shell: bash
        run: dotnet build tests/Forma.RenderTests/Forma.RenderTests.csproj --configuration Release -p:FormaRuntime="$FORMA_RUNTIME" --nologo
      - name: Build selected catalog host
        shell: bash
        run: |
          if [[ "$FORMA_RUNTIME" == "FNA" ]]; then
            project="samples/Forma.Catalog.FNA/Forma.Catalog.FNA.csproj"
          else
            project="samples/Forma.Catalog.MonoGame/Forma.Catalog.MonoGame.csproj"
          fi
          dotnet build "$project" --configuration Release -p:FormaRuntime="$FORMA_RUNTIME" --nologo
      - name: Install Linux graphics dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers vulkan-tools xvfb
          software_icd=$(find /opt/google/chrome -name 'vk_swiftshader_icd.json' -print -quit)
          software_icd=${software_icd:-$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)}
          test -n "$software_icd"
          echo "VK_ICD_FILENAMES=$software_icd" >> "$GITHUB_ENV"
          echo "VK_DRIVER_FILES=$software_icd" >> "$GITHUB_ENV"
      - name: Validate Linux selected runtime
        if: runner.os == 'Linux'
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
        run: |
          xvfb-run -a vulkaninfo --summary
          FormaRuntime="$FORMA_RUNTIME" xvfb-run -a bash scripts/check-catalog-smoke.sh
          xvfb-run -a dotnet test tests/Forma.RenderTests/Forma.RenderTests.csproj --configuration Release -p:FormaRuntime="$FORMA_RUNTIME" --no-build --nologo
          if [[ "$FORMA_RUNTIME" == "MonoGame" ]]; then
            MonoGamePlatform=Native CatalogBackend=Vulkan xvfb-run -a bash scripts/check-catalog-smoke.sh
          fi
      - name: Validate Linux FNA video
        if: runner.os == 'Linux' && matrix.runtime == 'FNA'
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
        run: xvfb-run -a bash scripts/check-fna-video-smoke.sh
      - name: Compare Linux peer rendering
        if: runner.os == 'Linux' && matrix.runtime == 'MonoGame'
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
        run: xvfb-run -a bash scripts/check-catalog-render-parity.sh
      - name: Validate Windows selected runtime
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if [[ "$FORMA_RUNTIME" == "MonoGame" ]]; then
            MonoGamePlatform=WindowsDX FormaRuntime=MonoGame bash scripts/check-catalog-smoke.sh
            dotnet test tests/Forma.RenderTests/Forma.RenderTests.csproj --configuration Release -p:FormaRuntime=MonoGame -p:MonoGamePlatform=WindowsDX --nologo
          else
            FormaRuntime=FNA bash scripts/check-catalog-smoke.sh
            dotnet test tests/Forma.RenderTests/Forma.RenderTests.csproj --configuration Release -p:FormaRuntime=FNA --no-build --nologo
          fi
      - name: Validate Windows FNA video
        if: runner.os == 'Windows' && matrix.runtime == 'FNA'
        shell: bash
        run: bash scripts/check-fna-video-smoke.sh
      - name: Compare Windows peer rendering
        if: runner.os == 'Windows' && matrix.runtime == 'MonoGame'
        shell: bash
        run: bash scripts/check-catalog-render-parity.sh
      - name: Validate macOS selected runtime
        if: runner.os == 'macOS'
        shell: bash
        run: FormaRuntime="$FORMA_RUNTIME" bash scripts/check-catalog-smoke.sh
      - name: Validate macOS render-test isolation
        if: runner.os == 'macOS'
        shell: bash
        run: dotnet test tests/Forma.RenderTests/Forma.RenderTests.csproj --configuration Release -p:FormaRuntime="$FORMA_RUNTIME" --no-build --nologo
      - name: Validate macOS FNA video
        if: runner.os == 'macOS' && matrix.runtime == 'FNA'
        shell: bash
        run: bash scripts/check-fna-video-smoke.sh
      - name: Compare macOS peer rendering
        if: runner.os == 'macOS' && matrix.runtime == 'MonoGame'
        shell: bash
        run: bash scripts/check-catalog-render-parity.sh
      - name: Install macOS Metal build prerequisites
        if: runner.os == 'macOS' && matrix.runtime == 'MonoGame'
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true
      - name: Set up Premake
        if: runner.os == 'macOS' && matrix.runtime == 'MonoGame'
        uses: abel0b/setup-premake@v2.4
        with:
          version: 5.0.0-beta2
      - name: Check out MonoGame Metal runtime source
        if: runner.os == 'macOS' && matrix.runtime == 'MonoGame'
        uses: actions/checkout@v4
        with:
          repository: zignd/MonoGame
          ref: 99716f1b02ba9db2130c754606d6b0303d039d15
          path: .native/MonoGame
          submodules: recursive
      - name: Build MonoGame Metal runtime
        if: runner.os == 'macOS' && matrix.runtime == 'MonoGame'
        working-directory: .native/MonoGame
        run: ./build.sh --target='Build Native Metal'
      - name: Validate MonoGame Metal catalog
        if: runner.os == 'macOS' && matrix.runtime == 'MonoGame'
        env:
          MonoGamePlatform: Native
          CatalogBackend: Metal
          NativeRuntimePath: ${{ github.workspace }}/.native/MonoGame/Artifacts/native/mgruntime/desktopmetal/macosx/Release/libmgruntime.dylib
        run: bash scripts/check-catalog-smoke.sh

  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: bash scripts/check-runtime-parity.sh

  package-consumers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: bash scripts/test-package-consumer.sh
      - uses: actions/upload-artifact@v4
        with:
          name: forma-peer-packages
          path: Artifacts/packages/*/*.*nupkg
          if-no-files-found: error
