name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet tool restore
      - run: bash scripts/check-compliance.sh
      - run: dotnet restore Forma.slnx --disable-parallel
      - run: dotnet build Forma.slnx --configuration Release --no-restore --maxcpucount:1
      - run: bash scripts/check-backend-references.sh
      - run: bash scripts/check-api-compatibility.sh
      - run: dotnet test tests/Forma.Tests/Forma.Tests.csproj --configuration Release --no-build
      - name: Install Linux Vulkan software driver
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gdb mesa-vulkan-drivers vulkan-tools vulkan-validationlayers
          software_icd=$(find /opt/google/chrome -name 'vk_swiftshader_icd.json' -print -quit)
          software_icd=${software_icd:-$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)}
          test -n "$software_icd"
          echo "VK_ICD_FILENAMES=$software_icd" >> "$GITHUB_ENV"
          echo "VK_DRIVER_FILES=$software_icd" >> "$GITHUB_ENV"
      - name: Validate Linux catalog and render tests
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
        run: |
          xvfb-run -a vulkaninfo --summary
          xvfb-run -a bash scripts/check-catalog-smoke.sh
          xvfb-run -a dotnet test tests/Forma.RenderTests/Forma.RenderTests.csproj --configuration Release --no-build
          CatalogNativeDebugger=gdb VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation MonoGamePlatform=Native CatalogBackend=Vulkan xvfb-run -a bash scripts/check-catalog-smoke.sh
      - name: Validate Windows catalog and render tests
        if: runner.os == 'Windows'
        shell: bash
        env:
          MonoGamePlatform: WindowsDX
        run: |
          bash scripts/check-catalog-smoke.sh
          dotnet test tests/Forma.RenderTests/Forma.RenderTests.csproj --configuration Release
      - name: Validate macOS catalog metrics baseline
        if: runner.os == 'macOS'
        run: bash scripts/check-catalog-smoke.sh
      - name: Validate macOS render-test isolation
        if: runner.os == 'macOS'
        run: dotnet test tests/Forma.RenderTests/Forma.RenderTests.csproj --configuration Release --no-build
      - name: Install macOS Metal build prerequisites
        if: runner.os == 'macOS'
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true
      - name: Set up Premake
        if: runner.os == 'macOS'
        uses: abel0b/setup-premake@v2.4
        with:
          version: 5.0.0-beta2
      - name: Check out MonoGame Metal runtime source
        if: runner.os == 'macOS'
        uses: actions/checkout@v4
        with:
          repository: zignd/MonoGame
          ref: 0c0ada246b3738f4aa6f1b6ba7d29af465faceaa
          path: .native/MonoGame
          submodules: recursive
      - name: Build MonoGame Metal runtime
        if: runner.os == 'macOS'
        working-directory: .native/MonoGame
        run: ./build.sh --target='Build Native Metal'
      - name: Validate macOS Metal catalog
        if: runner.os == 'macOS'
        env:
          MonoGamePlatform: Native
          CatalogBackend: Metal
          CatalogNativeDebugger: lldb
          NativeRuntimePath: ${{ github.workspace }}/.native/MonoGame/Artifacts/native/mgruntime/desktopmetal/macosx/Release/libmgruntime.dylib
        run: bash scripts/check-catalog-smoke.sh

  package-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: bash scripts/check-clean-source.sh
      - run: bash scripts/test-package-consumer.sh